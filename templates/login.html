
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaleExpress</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="website icon" href="{{ url_for('static', filename='img/logosite/SaleExpress Logo.png') }}">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #1e1e1e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    padding: 20px;
}

/* Card */
.container {
    background-color: #000;
    width: 100%;
    max-width: 420px;
    border-radius: 18px;
    padding: 40px 30px;
    box-shadow: 0 0 25px rgba(0, 174, 255, 0.4);
    border: 2px solid #00baff;
}

/* Header */
.informações {
    margin-bottom: 10px;
}

h1 {
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
}

/* Linha azul embaixo do título */
h1::after {
    content: "";
    display: block;
    width: 100%;
    height: 2px;
    background-color: #00baff;
    margin-top: 10px;
}

/* Texto abaixo do título */
.login-text {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 25px;
}

.login-text a {
    color: #00baff;
    text-decoration: none;
    font-weight: bold;
}

.login-text a:hover {
    text-decoration: underline;
}

/* Inputs */
input[type="text"],
input[type="email"],
input[type="number"],
input[type="password"] {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background-color: #fff;
    font-size: 14px;
    color: #000;
    margin-bottom: 15px;
}

input:focus {
    outline: none;
    box-shadow: 0 0 6px #00baff;
}

input::placeholder {
    color: #777;
}

/* Lembre-me */
.lembrar {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
}

.lembrar input[type="checkbox"] {
    margin-right: 8px;
    cursor: pointer;
}

.lembrar label {
    font-size: 14px;
    color: #fff;
}

/* Link esqueceu senha */
.link {
    display: block;
    color: #00baff;
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 20px;
}

.link:hover {
    text-decoration: underline;
}

/* Botão */
.btn-um {
    display: block;
    width: 100%;
    padding: 13px;
    background-color: #2bb6f7;
    color: white;
    text-align: center;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    margin-bottom: 25px;
    transition: background-color 0.3s ease;
}

.btn-um:hover {
    background-color: #1299d6;
}

 .cadastro-por {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 32px;
        }

        .icons a {
            transition: transform 0.3s, filter 0.3s;
            display: inline-block;
        }

        .icons a:hover {
            transform: scale(1.15);
            filter: brightness(1.2);
        }

/* Responsivo */
@media (max-width: 500px) {
    .container {
        padding: 30px 20px;
    }

    h1 {
        font-size: 24px;
    }
}

    </style>
</head>

<body>
    <div class="container">
        <div class="formulario">
            <div class="informações">
                <h1>LOGIN</h1>
            </div>
            <p class="login-text">
                Não tem conta?
                <a href="{{ url_for('form') }}">Cadastrar-se</a>
            </p>


            <form action="/login" method="POST">

                <input type="email" name="email" required placeholder="email">

                <input type="password" name="senha" placeholder="senha" required>

                <button type="submit" class="btn-um">Entrar</button>

            </form>



            <p class="cadastro-por">Cadastrar-se por</p>
            <div class="icons">
                <a href="https://www.facebook.com/login" style="color:#1877F2;"><i
                        class="fa-brands fa-facebook"></i></a>
                <a href="https://appleid.apple.com/sign-in" style="color:#828287;"><i
                        class="fa-brands fa-apple"></i></a>
                <a href="https://accounts.google.com/signin" style="color:#e34133;"><i
                        class="fa-brands fa-google"></i></a>
                <a href="https://www.linkedin.com/login" style="color:#1703ca;"><i
                        class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>
        <!--Fim do formulario-->
    </div>
    <!--Fim do container-->

</body>

</html>
