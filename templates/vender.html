<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vender - SaleExpress</title>

    <link rel="website icon" href="{{ url_for('static', filename='img/logosite/SaleExpress Logo.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=send" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at top, #0f2027, #000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 40px 20px;
        }

        a {
            color: #00baff;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .page-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
        }

        /* CARDS */
        .login__vendedor,
        .vender__produto {
            background: #0b0b0b;
            border-radius: 20px;
            padding: 40px;
            border: 2px solid #00baff;
            box-shadow: 0 0 30px rgba(0, 186, 255, 0.25);
        }

        h1 {
            font-size: 2rem;
            margin: 20px 0 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 10px;
        }

        /* LOGIN */
        .loginV__form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            box-shadow: 0 0 0 2px #00baff;
        }

        .loginV__button {
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #00baff, #0077ff);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .loginV__button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 186, 255, 0.6);
        }

        .criar__vendedor {
            margin-top: 25px;
        }

        /* VENDER PRODUTO */
        .imagem-produto {
            margin-bottom: 25px;
        }

        .imagem-produto input[type="file"] {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            margin: 15px 0;
        }

        #image-preview-container {
            border: 2px dashed #00baff;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            color: #aaa;
        }

        #image-preview {
            max-width: 200px;
            display: none;
            margin: 0 auto 10px;
            border-radius: 12px;
        }

        textarea {
            resize: none;
            height: 120px;
        }

        .valorProduto {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        details summary {
            cursor: pointer;
            margin-top: 15px;
        }

        details ul {
            list-style: none;
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        details button {
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: #111;
            color: #fff;
        }

        .postar {
            margin-top: 25px;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00baff, #0077ff);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .postar:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 186, 255, 0.6);
        }

        /* RESPONSIVO */
        @media (max-width: 900px) {
            .page-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">

        <!-- LOGIN -->
        <section class="login__vendedor">
            <a href="{{ url_for('catalogo') }}">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </a>

            <h1>Acesse sua conta como vendedor</h1>

            <form class="loginV__form">
                <input type="email" placeholder="Digite seu email" required>
                <input type="password" placeholder="Digite sua senha" required>
                <button class="loginV__button">Entrar</button>
            </form>

            <div class="criar__vendedor">
                <p>Ainda não é vendedor?</p>
                <a href="{{ url_for('form')}}">Crie sua conta aqui</a>
            </div>
        </section>

        <!-- VENDER -->
        <section class="vender__produto">

            <div class="imagem-produto">
                <a href="{{ url_for('catalogo') }}">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </a>

                <input type="file" id="file-input" accept="image/*">

                <div id="image-preview-container">
                    <img id="image-preview">
                    <p id="placeholder-text">Clique para adicionar uma imagem</p>
                </div>
            </div>

            <form>
                <p>Nome do produto</p>
                <input type="text" placeholder="Informe o nome do produto">

                <p>Descrição</p>
                <textarea placeholder="Digite a descrição do produto"></textarea>

                <p>Valor do produto</p>
                <div class="valorProduto">
                    <strong>R$</strong>
                    <input type="number" placeholder="0,00">
                </div>

                <details>
                    <summary>Categoria</summary>
                    <ul>
                        <li><button type="button">Tênis</button></li>
                        <li><button type="button">Roupas</button></li>
                        <li><button type="button">Eletrônicos</button></li>
                        <li><button type="button">Cosméticos</button></li>
                        <li><button type="button">Esportes</button></li>
                    </ul>
                </details>

                <button class="postar">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </form>

        </section>

    </div>

    <script>
        const input = document.getElementById('file-input');
        const preview = document.getElementById('image-preview');
        const text = document.getElementById('placeholder-text');

        input.addEventListener('change', () => {
            const file = input.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                text.style.display = 'none';
            }
        });
    </script>

</body>

</html>
