
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>SaleExpress</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="website icon" href="{{ url_for('static', filename='img/logosite/SaleExpress Logo.png') }}">
    <style>
        body {
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        /* Card principal */
        .container {
            background-color: #000;
            width: 100%;
            max-width: 320px;
            height: 630px;
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow: 0 0 25px rgba(0, 174, 255, 0.4);
            border: 2px solid #00baff;
        }

        /* Centralização do formulário */
        .formulario {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Título */
        h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 10px;
        }

        /* Linha abaixo do título */
        h1::after {
            content: "";
            display: block;
            width: 100%;
            height: 2px;
            background-color: #00baff;
            margin-top: 10px;
        }

        /* Texto login */
        .login-text {
            text-align: center;
            margin: 15px 0 25px;
            color: #ccc;
            font-size: 14px;
        }

        .login-text a {
            color: #00baff;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 6px #00baff;
        }

        /* Botão principal */
        .btn-um {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #2bb6f7;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-um:hover {
            background-color: #1299d6;
        }

        /* Texto cadastro por */
        .cadastro-por {
            text-align: center;
            margin: 25px 0 15px;
            color: #34495e;
            font-size: 14px;
        }

        .icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 28px;
        }

        .icons a {
            transition: transform 0.3s, filter 0.3s;
            display: inline-block;
        }

        .icons a:hover {
            transform: scale(1.2);
            filter: brightness(1.2);
        }

        /* Responsivo */
        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="formulario">
            <div class="informacoes">
                <h1>CADASTRO</h1>
            </div>
            <p class="login-text">Já tem uma conta? <a href="/login">Login</a></p>

            <form id="cadastroForm" action="/receber" method="post">

                <label>
                    <input id="nome" type="text" name="nome" placeholder="Nome completo" required>
                </label>

                <label>
                    <input id="email" type="email" name="email" placeholder="E-mail" required>
                </label>

                <label>
                    <input id="senha" type="password" name="senha" placeholder="Senha" required>
                </label>


                <label>
                    <input id="data" type="date" name="data" required>
                </label>

                <label>
                    <input id="endereco" type="text" name="endereco" placeholder="Endereço" required>
                </label>

                <label>
                    <input id="cpf" type="text" name="cpf" placeholder="CPF" required>
                </label>

                

                
                {% with mensagens = get_flashed_messages() %}
                {% if mensagens %}
                {% for msg in mensagens %}
                <p style="color:red;">{{ msg }}</p>
                {% endfor %}
                {% endif %}
                {% endwith %}               
                

                <div id="resultado"></div>

                <button class="btn-um" type="submit">Cadastrar-se</button>

            </form>

            <p class="cadastro-por">Cadastrar-se por</p>
            <div class="icons">
                <a href="https://www.facebook.com/login" style="color:#1877F2;"><i
                        class="fa-brands fa-facebook"></i></a>
                <a href="https://appleid.apple.com/sign-in" style="color:#828287;"><i
                        class="fa-brands fa-apple"></i></a>
                <a href="https://accounts.google.com/signin" style="color:#e34133;"><i
                        class="fa-brands fa-google"></i></a>
                <a href="https://www.linkedin.com/login" style="color:#1703ca;"><i
                        class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>

    </div>
    <script src="{{ url_for('static', filename='js/cadastrar.js') }}"></script>
</body>


</html>
